# Refreshes the profile README's animated images once a day.
#   stats: rebuilds assets/stats-*.svg (and the header) from live GitHub data
#   snake: draws the contribution-graph animation onto the `output` branch
name: Refresh profile images

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SVGs
        run: python3 scripts/build_assets.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Refresh profile stats" && git push)

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#a87a1e&color_dots=#ebedf0,#f3e3b8,#e2c36f,#c69a3a,#8a6416
            dist/snake-dark.svg?palette=github-dark&color_snake=#d4a94c&color_dots=#161b22,#3b3220,#6e5626,#a8822f,#d4a94c
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
