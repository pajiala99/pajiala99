inite"/><rect x="310" y="120" width="40" height="20" rx="10" fill="#a87a1e"><animate attributeName="fill" values="#a87a1e;#a87a1e;#1a7f37;#1a7f37" keyTimes="0;0.73;0.74;1" dur="8s" begin="0s" repeatCount="indefinite"/></rect><text class="chip" x="330" y="134" text-anchor="middle" style="fill:#fbf8f1">SOS</text></g><line x1="120" y1="102" x2="120" y2="262" stroke="#a87a1e" stroke-width="1.5" opacity=".55"><animate attributeName="x1" values="120;572" keyTimes="0;1" dur="8s" begin="0s" repeatCount="indefinite"/><animate attributeName="x2" values="120;572" keyTimes="0;1" dur="8s" begin="0s" repeatCount="indefinite"/></line>
